name: Jimmy Robotics & WebXR CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-workspace-tests:
    name: Cargo Test (jimmy-core + jimmy-daemon)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace unit tests (14/14)
        run: cargo test --workspace -- --nocapture

      - name: Verify WebXR, URDF & 11 Printable STL CAD assets exist
        run: |
          test -f ros2/jimmy_description/urdf/jimmy_full_body.urdf.xacro
          test -f web/index.html
          test -f web/xr-app.js
          test -f web/daemon-client.js
          test -f web/desk-widgets.js
          test -f docs/hardware/ASSEMBLY_AND_BOM_V1.md
          test -f docs/media/quest3_passthrough_live.gif
          test -f docs/media/cad_parts_preview.png
          test -f cad/stl/01_wheeled_base_shell.stl
          test -f cad/stl/01a_left_foot_half_platform.stl
          test -f cad/stl/01b_right_foot_half_platform.stl
          test -f cad/stl/01c_bionic_leg_strut.stl
          test -f cad/stl/01d_pelvis_hip_bridge.stl
          test -f cad/stl/02_waist_3pivot_gimbal.stl
          test -f cad/stl/03_torso_armor_shell.stl
          test -f cad/stl/04_cyber_clippy_head_visor.stl
          test -f cad/stl/05_upper_arm_bionic_link.stl
          test -f cad/stl/06_forearm_wrist_flange.stl
          test -f cad/stl/07_modular_3finger_hand.stl
