<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jimmy — Quest 3 WebXR & Mass Effect Omni-HUD</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="hud-overlay">
    <div class="me-title">OMNI-LINK // AR-BOT-JIMMY (38 CM)</div>
    <p style="font-size:0.82rem;margin:8px 0;color:#cbd5e1;">
      3-Pivot ROS 2 Humanoid + Curved Mass Effect Palm Hologram (<code>right_wrist_flange_link</code>)
    </p>
    <div class="btn-grid">
      <button class="me-btn" onclick="setJimmyGesture('PresentPalmHologram')">Omni-Palm HUD</button>
      <button class="me-btn" onclick="setJimmyGesture('CyberClippyLean')">Cyber-Clippy Lean</button>
      <button class="me-btn" onclick="setJimmyGesture('ItalianShrug')">Italian Shrug</button>
      <button class="me-btn" onclick="setJimmyGesture('FriendlyWave')">Friendly Wave</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px;">
      <input id="jimmy-input" placeholder="Talk to Jimmy (TR/EN)..." style="flex:1;background:#020617;color:#f8fafc;border:1px solid #38bdf8;border-radius:6px;padding:6px 8px;font-size:0.78rem;" onkeydown="if(event.key==='Enter')askJimmyText()" />
      <button class="me-btn" onclick="askJimmyText()">Send</button>
      <button class="me-btn" onclick="startJimmyVoiceMic()" title="Voice Mic">🎙️</button>
      <button class="me-btn" onclick="toggleJimmyIkOrb()" title="Toggle 3D IK Target Orb">🎯 IK</button>
    </div>
    <pre id="telemetry" style="margin-top:10px;font-size:0.75rem;color:#fbbf24;white-space:pre-wrap;"></pre>
  </div>
  <script type="module" src="./xr-app.js"></script>
</body>
</html>
